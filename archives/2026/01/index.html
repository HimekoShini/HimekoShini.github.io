        if (!ttl) return
        const expiry = Date.now() + ttl * 86400000
        localStorage.setItem(key, JSON.stringify({ value, expiry }))
      },
      get: key => {
        const itemStr = localStorage.getItem(key)
        if (!itemStr) return undefined
        const { value, expiry } = JSON.parse(itemStr)
        if (Date.now() > expiry) {
          localStorage.removeItem(key)
          return undefined
        }
        return value
      }
    }

    window.btf = {
      saveToLocal,
      getScript: (url, attr = {}) => new Promise((resolve, reject) => {
        const script = document.createElement('script')
        script.src = url
        script.async = true
        Object.entries(attr).forEach(([key, val]) => script.setAttribute(key, val))
        script.onload = script.onreadystatechange = () => {
          if (!script.readyState || /loaded|complete/.test(script.readyState)) resolve()
        }
        script.onerror = reject
        document.head.appendChild(script)
      }),
      getCSS: (url, id) => new Promise((resolve, reject) => {
        const link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = url
        if (id) link.id = id
        link.onload = link.onreadystatechange = () => {
          if (!link.readyState || /loaded|complete/.test(link.readyState)) resolve()
        }
        link.onerror = reject
        document.head.appendChild(link)
      }),

        globalFn[key] = globalFn[key] || {}

      }

            else {

                        if (matchC) {
                            let idx = cText.indexOf(kw);
                            let start = Math.max(0, idx - 15); let end = Math.min(cText.length, idx + 60);
                            contentSnippet = item.content.substring(start, end).replace(new RegExp(kw, 'gi'), '<em class="search-keyword">$&</em>');
                            if (start > 0) contentSnippet = '...' + contentSnippet;
                            if (end < cText.length) contentSnippet += '...';
                        } else { contentSnippet = item.content.substring(0, 60) + '...'; }

                        htmlStr += `<li><a href="${item.url}" class="search-result-title">${titleRender}</a><p class="search-result">${contentSnippet}</p></li>`;
                    }
                });

                if(htmlStr === '') htmlStr = '<div class="hmk-search-empty">什么都没有...</div>';
                
                dropdown.innerHTML = `<ul>${htmlStr}</ul>`;
                dropdown.classList.add('show-magic');

                dropdown.querySelectorAll('li').forEach(li => {
                   li.addEventListener('click', function() { const anchor = this.querySelector('a'); if(anchor) window.location.href = anchor.href; });
                });
            });

            document.addEventListener('click', function(e) { if (!wrapper.contains(e.target)) dropdown.classList.remove('show-magic'); });
            bar.addEventListener('click', function() { topInput.focus(); if(topInput.value.trim() !== '' && dropdown.innerHTML.trim() !== '') dropdown.classList.add('show-magic'); });
        }
    }

    function buildCodeHighlight() {
        document.querySelectorAll('#article-container figure.highlight').forEach(block => {
            let classStr = block.className.toLowerCase();
            let attrLang = (block.getAttribute('data-lang') || '').toLowerCase();
            let langSpan = block.querySelector('.code-lang');
            let langText = langSpan ? langSpan.textContent.toLowerCase() : '';

            if (classStr.includes('gdscript') || classStr.includes('plain') || attrLang.includes('gdscript') || attrLang.includes('plain') || langText.includes('gdscript') || langText.includes('plain')) {
                if (langSpan) langSpan.textContent = 'GDSCRIPT';
                
                let codeContainer = block.querySelector('.code pre');
                if(!codeContainer || codeContainer.hasAttribute('data-gd-fix')) return;
                codeContainer.setAttribute('data-gd-fix', '1');
                
                let walker = document.createTreeWalker(codeContainer, NodeFilter.SHOW_TEXT, null, false);
                let textNodes = []; let n;
                while (n = walker.nextNode()) textNodes.push(n);
                
                textNodes.forEach(node => {
                    let rawText = node.nodeValue;
                    if(!rawText || !rawText.trim()) return; 

                    let tempStore = [];
                    let pushStr = val => { tempStore.push(val); return `__GDMK_${tempStore.length-1}__`; };
                    
                    let lineText = rawText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    
                    lineText = lineText.replace(/&quot;.*?&quot;|&#39;.*?&#39;|".*?"|'.*?'/g, match => pushStr(`<span class="string">${match}</span>`));
                    lineText = lineText.replace(/#.*/g, match => pushStr(`<span class="comment">${match}</span>`));
                    lineText = lineText.replace(/@[A-Za-z0-9_]+/g, match => pushStr(`<span class="attr">${match}</span>`));
                    lineText = lineText.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)(?=\s*\()/g, match => pushStr(`<span class="title function_">${match}</span>`));
                    lineText = lineText.replace(/\b(extends|func|var|if|elif|else|for|while|match|break|continue|pass|return|class|class_name|enum|signal|await|yield|const|static|in|and|or|not|is|as|void)\b/g, match => pushStr(`<span class="keyword">${match}</span>`));
                    lineText = lineText.replace(/\b(self|true|false|null|PI|TAU|INF|NAN)\b/g, match => pushStr(`<span class="built_in">${match}</span>`));
                    lineText = lineText.replace(/\b(\d+(\.\d+)?)\b/g, match => pushStr(`<span class="number">${match}</span>`));
                    
                    if(tempStore.length > 0) {
                        lineText = lineText.replace(/__GDMK_(\d+)__/g, (match, idx) => tempStore[idx]);
                        let wrapper = document.createElement('span'); wrapper.innerHTML = lineText;
                        let frag = document.createDocumentFragment();
                        while(wrapper.firstChild) frag.appendChild(wrapper.firstChild);
                        node.parentNode.replaceChild(frag, node);
                    }
                });
            }
        });
    }

    // 🔥 新的解析内核：支持你的卡片和原有体系，并且防御被MD撕裂段落！ 🔥
    function parseWikiSyntax() {
        const container = document.getElementById('article-container');
        if(!container || container.hasAttribute('data-wiki-parsed')) return;
        container.setAttribute('data-wiki-parsed', '1');

        let containerHtml = container.innerHTML;
        
        if (containerHtml.includes('{=midi|')) {
            let preBlocks_m = [];
            containerHtml = containerHtml.replace(/<(pre|code|figure)[\s\S]*?<\/\1>/gi, match => { preBlocks_m.push(match); return `___HMK_SAFE_BLOCK_M_${preBlocks_m.length-1}___`; });
            
            containerHtml = containerHtml.replace(/<p>\s*\{=midi\|(.*?)=\}\s*<\/p>|\{=midi\|(.*?)=\}/g, (match, p1, p2) => {
                const tgt = (p1 || p2 || "").trim();
                return `</p><div class="hmk-midi-mount" data-midi-url="${tgt}"></div><p>`;
            });
            containerHtml = containerHtml.replace(/___HMK_SAFE_BLOCK_M_(\d+)___/g, (match, i) => preBlocks_m[i]);
        }

        if (containerHtml.includes('{=fold|') || containerHtml.includes('{=dl-')) {
            let preBlocks = [];
            containerHtml = containerHtml.replace(/<(pre|code|figure)[\s\S]*?<\/\1>/gi, match => { preBlocks.push(match); return `___HMK_SAFE_BLOCK_${preBlocks.length-1}___`; });
            
            let foldOrDlChanged = false;

            // ⚔️ 净化器防弹涂层核心 ⚔️：在正式分发前，提取真正的字符串，彻底干掉 Hexo 的 HTML 注入暗枪！
            containerHtml = containerHtml.replace(/\{=dl-(dir|ex)\|([\s\S]*?)=\}/g, function(fullMatch) {
                let domScraper = document.createElement('div');
                domScraper.innerHTML = fullMatch;
                return domScraper.textContent || domScraper.innerText || ""; // 这会把所有的 <a href=...> 洗去！变回纯原文字！
            });

            // 1. 原生块解析：代码折叠模块
            containerHtml = containerHtml.replace(/\{=fold\|(.*?)\|([\s\S]*?)=\}/g, (match, title, txt) => {
                foldOrDlChanged = true;
                return `</p><details class="hmk-fold"><summary><span class="hmk-fold-title">${title}</span><span class="hmk-fold-state"></span></summary><div class="hmk-fold-content"><p>${txt}</p></div></details><p>`;
            });

            // 2. 净化后安全的 直接下载解析
            containerHtml = containerHtml.replace(/\{=dl-dir\|(.*?)\|(.*?)\|(.*?)=\}/g, (match, url, title, desc) => {
                foldOrDlChanged = true;
                let link = url.trim();
                return `</p><a href="${link}" download class="hmk-download-card"><span class="hmk-dl-icon"><i class="fas fa-file-download"></i></span><span class="hmk-dl-info"><span class="hmk-dl-title">${title.trim()}</span><span class="hmk-dl-meta">${desc.trim()} <span class="hmk-badge"><i class="fas fa-arrow-down"></i> 一键直连</span></span></span></a><p>`;
            });

            // 3. 净化后安全的 外部资源解析 
            containerHtml = containerHtml.replace(/\{=dl-ex\|(.*?)\|(.*?)\|(.*?)\|(.*?)=\}/g, (match, url, diskName, title, desc) => {
                foldOrDlChanged = true;
                let link = url.trim(); 

                let n = diskName.trim().toLowerCase();
                let iClass = "fas fa-cloud-download-alt"; 
                if(n.includes("百度")) iClass = "fas fa-paw";
                else if(n.includes("阿里")) iClass = "fab fa-alipay"; 
                else if(n.includes("谷歌") || n.includes("google")) iClass = "fab fa-google-drive";
                else if(n.includes("微云") || n.includes("腾讯") || n.includes("qq")) iClass = "fab fa-qq";
                else if(n.includes("蓝奏")) iClass = "fas fa-cloud";
                else if(n.includes("夸克")) iClass = "fas fa-atom";
                else if(n.includes("onedrive") || n.includes("微软")) iClass = "fab fa-windows";
                else if(n.includes("github")) iClass = "fab fa-github";
                else if(n.includes("云盘") || n.includes("网盘")) iClass = "fas fa-hdd";
                
                return `</p><a href="${link}" target="_blank" rel="noopener noreferrer" class="hmk-download-card"><span class="hmk-dl-icon"><i class="${iClass}"></i></span><span class="hmk-dl-info"><span class="hmk-dl-title">${title.trim()}</span><span class="hmk-dl-meta">${desc.trim()} <span class="hmk-badge"><i class="fas fa-external-link-alt"></i> ${diskName.trim()}跃迁</span></span></span></a><p>`;
            });

            if (foldOrDlChanged) {
                containerHtml = containerHtml.replace(/___HMK_SAFE_BLOCK_(\d+)___/g, (match, i) => preBlocks[i]);
            }
        }

        container.innerHTML = containerHtml;

        let footnoteList = [];
        const targetBlocks = container.querySelectorAll('p, li, td, th, h1, h2, h3, h4, h5, h6');
        const inlineRegex = /\{=(color|黑幕|模糊|ruby|note|float|shake)\|([\s\S]*?)=\}/g;

        targetBlocks.forEach(block => {
            if (!document.body.contains(block) || block.closest('figure.highlight, figure, pre, code, .code, .gutter, .highlight-tools')) return;
            let html = block.innerHTML;
            if (html.includes('{=')) {
                let changed = false;
                html = html.replace(inlineRegex, (match, cmd, content) => {
                    changed = true;
                    if (cmd === 'color') {
                        let firstPipe = content.indexOf('|');
                        if (firstPipe === -1) return match;
                        let c = content.substring(0, firstPipe); let txt = content.substring(firstPipe + 1);
                        return `<span style="color:${c}">${txt}</span>`;
                    } else if (cmd === '黑幕') {
                        let firstPipe = content.indexOf('|');
                        let txt = content; let hover = '你知道的太多了';
                        if (firstPipe !== -1) { txt = content.substring(0, firstPipe); hover = content.substring(firstPipe + 1) || hover; }
                        return `<span class="hmk-heimu" title="${hover}">${txt}</span>`;
                    } else if (cmd === '模糊') { return `<span class="hmk-blur">${content}</span>`; } 
                    else if (cmd === 'ruby') {
                        let firstPipe = content.indexOf('|');
                        if (firstPipe === -1) return match;
                        let base = content.substring(0, firstPipe); let top = content.substring(firstPipe + 1);
                        return `<ruby>${base}<rp>(</rp><rt>${top}</rt><rp>)</rp></ruby>`;
                    } else if (cmd === 'note') {
                        let fIdx = footnoteList.length + 1; footnoteList.push(content);
                        return `<sup class="hmk-note-mark" id="hmk-fnref-${fIdx}"><a href="#hmk-fn-${fIdx}">${fIdx}</a></sup>`;
                    } else if (cmd === 'float' || cmd === 'shake') {
                        let tempDiv = document.createElement('div'); tempDiv.innerHTML = content; let charCounter = { val: 0 };
                        let wrapNode = function(node) {
                            if (node.nodeType === 3) {
                                let frag = document.createDocumentFragment();
                                for (let char of node.nodeValue) {
                                    if (char.trim() === '') { frag.appendChild(document.createTextNode(char)); } 
                                    else {
                                        let s = document.createElement('span'); s.textContent = char;
                                        s.style.animationDelay = cmd === 'float' ? `${charCounter.val * 0.1}s` : `${Math.random() * 0.5}s`;
                                        frag.appendChild(s); charCounter.val++;
                                    }
                                }
                                node.parentNode.replaceChild(frag, node);
                            } else if (node.nodeType === 1) { Array.from(node.childNodes).forEach(wrapNode); }
                        };
                        Array.from(tempDiv.childNodes).forEach(wrapNode);
                        return `<span class="hmk-text-${cmd}">${tempDiv.innerHTML}</span>`;
                    }
                    return match;
                });
                if (changed) block.innerHTML = html;
            }
        });

        if (footnoteList.length > 0) {
            let fnDiv = document.createElement('div'); fnDiv.className = 'footnotes';
            let ol = document.createElement('ol'); ol.style.cssText = "margin: 0; padding-left: 20px;";
            footnoteList.forEach((text, i) => {
                let id = i + 1; let li = document.createElement('li'); li.id = `hmk-fn-${id}`; li.className = "footnote-item";
                li.innerHTML = `<span>${text}</span> <a href="#hmk-fnref-${id}" style="color:var(--hmk-theme-color); font-weight:bold; padding-left: 8px; text-decoration:none;" title="回到刚刚看的地方">↩</a>`;
                ol.appendChild(li);
            });
            fnDiv.appendChild(ol); container.appendChild(fnDiv);
        }
    }

    // == 高能音频计算/增益总线/防暴节点与图阵重列合辑 ==
    function loadSynthesizerAndBind(midiUrl, tracksWrap, btnMode, volB, bpmB, btnPlay, ruler, canvasCon, playhead, keysInner, noteNames, gridWrap) {
        const bpmVal = bpmB.querySelector('.h-bpm-v');
        const bpmSlider = bpmB.querySelector('.h-bpm-s');
        const volSlider = volB.querySelector('.h-vol-s');
        
        const startBinding = () => {
            btnPlay.innerText = 'READING...';
            fetch(midiUrl).then(res => {
                if (!res.ok) throw new Error("外部音乐加载无权限或未打通");
                return res.arrayBuffer();
            }).then(buffer => {
                const midiObj = new window.Midi(buffer);
                const bTicks = midiObj.header.ppq || 480; 
                
                let fBpm = 120;
                if(midiObj.header.tempos.length > 0) fBpm = Math.round(midiObj.header.tempos[0].bpm);
                bpmSlider.value = fBpm; bpmSlider.disabled = false;
                
                let tsNum = 4; let tsDen = 4;
                if(midiObj.header.timeSignatures.length > 0) {
                    tsNum = midiObj.header.timeSignatures[0].timeSignature[0];
                    tsDen = midiObj.header.timeSignatures[0].timeSignature[1];
                }
                
                // 我们把时间具像化，以一拍占用40像素计，算出整小节尺寸用来打底层格
                const pxPerBeat = 40; 
                const tickToPx = pxPerBeat / bTicks; 
                const measureWidthPx = tsNum * (4 / tsDen) * pxPerBeat; 

                const validTracks = midiObj.tracks.filter(tr => tr.notes.length > 0);
                if(validTracks.length === 0) throw new Error("音源谱纯空。");

                let isPlaying = false; 
                let loopAnim = null;
                
                // == 全局压限与总增益大本营！Tone.Limiter => Destination == 
                if(!window.hmkMasterBusBuilt) {
                    window.hmkMasterBusBuilt = true;
                    // 终极音量放大节点，负责暴戾增效
                    window.hmkMasterVolume = new window.Tone.Volume(4).toDestination();
                    // 音量天花板压榨器！无论多炸哪怕破0分贝，在这里被按住柔性挤压输出到Volume发声。彻底避免撕裂噼啪声。
                    window.hmkMasterLimiter = new window.Tone.Limiter(-0.5).connect(window.hmkMasterVolume);
                }

                // 连接 UI 和实际系统级增益器
                volSlider.disabled = false;
                volSlider.oninput = (e) => {
                   if(window.hmkMasterVolume) window.hmkMasterVolume.volume.value = Number(e.target.value);
                }
                // 上膛当前滑动位置同步至物理音箱
                window.hmkMasterVolume.volume.value = Number(volSlider.value);
                
                let sysActiveSynths = {};
                // 复用或者创建全新专属轨琴机。赋予更高阶的电子声波让声音雄厚而空灵。
                function getSynthByTrack(tr) {
                   if (!sysActiveSynths[tr.id || tr.name]) {
                       let isDrum = tr.instrument.percussion || (tr.name || "").toLowerCase().includes("drum");
                       if(isDrum) {
                           sysActiveSynths[tr.id || tr.name] = new window.Tone.PolySynth(window.Tone.MembraneSynth, { 
                               volume: -4, 
                               envelope: { attack: 0.005, decay: 0.2, sustain: 0, release: 0.2 } 
                           }).connect(window.hmkMasterLimiter);
                       } else {
                           // 【超高解析振荡阵法】：替换廉价sine，使用带模拟味的正弦波调制宽三角。保留广阔包络释放时长(release)。
                           sysActiveSynths[tr.id || tr.name] = new window.Tone.PolySynth(window.Tone.Synth, { 
                               oscillator: { type: "amtriangle", harmonicity: 0.5, modulationType: "sine" },
                               envelope: { attack: 0.015, decay: 0.3, sustain: 0.3, release: 1.5 },
                               volume: -10  // 给10和弦或者8首MIX预留的物理低切空腔，保证音波通透明朗撞向Limiter。
                           }).connect(window.hmkMasterLimiter);
                           // PolySynth 释放更大资源容量应对史诗级曲谱的疯狂落雷和扫弦不断层。
                           sysActiveSynths[tr.id || tr.name].maxPolyphony = 32; 
                       }
                   }
                   return sysActiveSynths[tr.id || tr.name];
                }

                // 重清理调度并关闭长延残响
                function cleanupEngines() {
                    if(isPlaying) {
                        window.Tone.Transport.stop(); window.Tone.Transport.cancel(0); cancelAnimationFrame(loopAnim);
                        isPlaying = false; btnPlay.innerText = 'PLAY'; btnPlay.classList.remove('active');
                        playhead.style.display = 'none';
                    }
                    for (const key in sysActiveSynths) { sysActiveSynths[key].releaseAll(); }
                    canvasCon.querySelectorAll('.hmk-midi-note').forEach(el => el.remove());
                    cachedNoteObjects = [];
                }

                let cachedNoteObjects = []; 
                let currentMode = 'SOLO'; 
                
                // ✨ 构建DOM、标定格律红线
                function renderVisualMap(mode, singleTargetTr = null) {
                    cleanupEngines();
                    let tgtArr = mode === 'SOLO' && singleTargetTr ? [singleTargetTr] : validTracks;
                    let maxW = measureWidthPx;
                    
                    tgtArr.forEach(track => {
                        track.notes.forEach(note => {
                            let rIdx = noteNames.indexOf(note.name);
                            if (rIdx === -1) return;
                            
                            let topPos = rIdx * 26; 
                            let leftPos = note.ticks * tickToPx; 
                            let wSize = note.durationTicks * tickToPx;
                            
                            const nb = document.createElement('div'); nb.className = 'hmk-midi-note';
                            // MIX下采用彩糖碎片阵掩盖轨线杂乱感
                            if (mode === 'MIX') { nb.style.background = `rgba(${120 + Math.random()*80}, ${120 + Math.random()*80}, ${150 + Math.random()*60}, 0.8)`; nb.style.border='none'; }
                            nb.style.top = topPos + 'px'; nb.style.left = leftPos + 'px'; nb.style.width = Math.max(3, wSize) + 'px';
                            canvasCon.appendChild(nb);
                            
                            cachedNoteObjects.push({ dom: nb, name: note.name, tBase: note.ticks, dBase: note.durationTicks, trBinder: track });
                            if (leftPos + wSize + 150 > maxW) maxW = leftPos + wSize + 150;
                        });
                    });
                    
                    // 倍乘格规法填充，天衣无缝黑暗切换色度网
                    maxW = Math.ceil(maxW / measureWidthPx) * measureWidthPx;
                    canvasCon.style.width = maxW + 'px';
                    
                    let totalMeasures = Math.ceil(maxW / measureWidthPx);
                    ruler.innerHTML = ''; ruler.style.width = maxW + 'px';
                    for(let i = 1; i <= totalMeasures; i++) { 
                        let sc = document.createElement('span'); sc.innerText = i; sc.style.width = measureWidthPx + 'px'; 
                        ruler.appendChild(sc); 
                    }

                    canvasCon.style.backgroundImage = `
                      repeating-linear-gradient(to right, transparent, transparent ${pxPerBeat - 1}px, var(--hmk-midi-grid-line) ${pxPerBeat - 1}px, var(--hmk-midi-grid-line) ${pxPerBeat}px),
                      repeating-linear-gradient(to right, transparent, transparent ${measureWidthPx}px, var(--hmk-midi-grid-alt) ${measureWidthPx}px, var(--hmk-midi-grid-alt) ${measureWidthPx * 2}px),
                      repeating-linear-gradient(to bottom, transparent, transparent 25px, var(--hmk-midi-grid-line) 25px, var(--hmk-midi-grid-line) 26px)
                    `;
                    canvasCon.style.backgroundSize = `auto, auto, auto`;

                    // 超智慧：自寻发声源，计算这幅百键巨型画板中真正的火力密集地带，并卷过滑轮视界居中！避免上万次切歌后的傻盯黑屏现象
                    if(cachedNoteObjects.length > 0) {
                        let topCacheSum = 0;
                        cachedNoteObjects.forEach(b => topCacheSum += parseFloat(b.dom.style.top));
                        let meanCenterY = topCacheSum / cachedNoteObjects.length;
                        // 中心上飘 130，以使得该中心轴被完美承接在这 312高 度的小小视野核心
                        setTimeout(() => { gridWrap.scrollTop = Math.max(0, meanCenterY - 130); }, 50);
                    }
                }

                tracksWrap.innerHTML = '';
                validTracks.forEach((tr, i) => {
                    let labelName = tr.name || (tr.instrument ? tr.instrument.name : `Track ${i+1}`);
                    if(!labelName || labelName.trim()==="") labelName = `Track ${i+1}`;
                    let tkb = document.createElement('button');
                    tkb.className = 'hmk-midi-btn'; tkb.innerText = labelName; tkb.title = labelName; 
                    
                    tkb.onclick = () => { 
                        currentMode = 'SOLO';
                        btnMode.className = 'hmk-mode-btn'; btnMode.innerText = 'MODE: SOLO';
                        Array.from(tracksWrap.children).forEach(btn => btn.classList.remove('active')); 
                        tkb.classList.add('active'); 
                        renderVisualMap('SOLO', tr); 
                    };
                    tracksWrap.appendChild(tkb);
                });

                // 黑客化切换合鸣阵
                btnMode.onclick = () => {
                    if (currentMode === 'SOLO') {
                        currentMode = 'MIX';
                        btnMode.className = 'hmk-mode-btn mode-mix'; btnMode.innerText = 'MODE: MIX ALL';
                        Array.from(tracksWrap.children).forEach(btn => btn.classList.add('active')); 
                        renderVisualMap('MIX', null);
                    } else {
                        currentMode = 'SOLO';
                        btnMode.className = 'hmk-mode-btn'; btnMode.innerText = 'MODE: SOLO';
                        if (tracksWrap.children.length > 0) tracksWrap.children[0].click(); // 打碎并回归初选模式轨1
                    }
                };

                // 左盘真键盘交互测点试音阵(随便借借第一组的主战器去响即可)
                let testKeyMachine = new window.Tone.PolySynth(window.Tone.Synth, { oscillator: { type: "amtriangle" }, volume:-8 }).connect(window.hmkMasterLimiter);
                Array.from(keysInner.children).forEach((kd, idx) => {
                   let noteStr = noteNames[idx];
                   const triggerDown = (e) => {
                       if(testKeyMachine.loaded !== false) testKeyMachine.triggerAttack(noteStr);
                       e.currentTarget.classList.add('pressed');
                   };
                   const triggerUp = (e) => {
                       if(testKeyMachine.loaded !== false) testKeyMachine.triggerRelease(noteStr);
                       e.currentTarget.classList.remove('pressed');
                   };
                   kd.addEventListener('mousedown', triggerDown);
                   kd.addEventListener('touchstart', (e)=>{ e.preventDefault(); triggerDown(e); }, {passive: false});
                   kd.addEventListener('mouseup', triggerUp); kd.addEventListener('mouseleave', triggerUp);
                   kd.addEventListener('touchend', triggerUp); kd.addEventListener('touchcancel', triggerUp);
                });

                bpmSlider.oninput = (e) => { if(window.Tone && window.Tone.Transport) window.Tone.Transport.bpm.value = Number(e.target.value); };

                if(tracksWrap.children.length > 0) tracksWrap.children[0].click();
                
                btnPlay.disabled = false; btnPlay.innerText = 'PLAYING?';
                
                btnPlay.onclick = async () => {
                    if (cachedNoteObjects.length === 0) return;
                    await window.Tone.start();

                    if(isPlaying) {
                        cleanupEngines();
                        if(currentMode==='SOLO') {
                           let actBtn = Array.from(tracksWrap.children).find(b=>b.classList.contains('active'));
                           if(actBtn) actBtn.click(); else tracksWrap.children[0].click();
                        } else renderVisualMap('MIX');

                    } else {
                        window.Tone.Transport.stop(); window.Tone.Transport.cancel(0); 
                        window.Tone.Transport.bpm.value = Number(bpmSlider.value);
                        playhead.style.display = 'block'; playhead.style.transform = 'translateX(0px)';
                        
                        cachedNoteObjects.forEach(n => {
                            const beatsInSec = 60 / window.Tone.Transport.bpm.value;
                            const rStart = (n.tBase / bTicks) * beatsInSec; 
                            const rDur = (n.dBase / bTicks) * beatsInSec;
                            // 这里是最神奇的点：按照存入时的挂轨名获取独立发声盒保证分离
                            let tSynth = getSynthByTrack(n.trBinder);
                            
                            window.Tone.Transport.schedule((time) => {
                                tSynth.triggerAttackRelease(n.name, rDur, time);
                                window.Tone.Draw.schedule(() => {
                                    if(n.dom) {
                                      n.dom.classList.add('playing');
                                      setTimeout(() => { if(n.dom) n.dom.classList.remove('playing'); }, rDur * 1000);
                                    }
                                }, time);
                            }, rStart);
                        });
                        
                        window.Tone.Transport.start("+0.1"); isPlaying = true;
                        btnPlay.innerText = 'STOP OR MIX REWIND'; btnPlay.classList.add('active');
                        
                        const scrollerGrid = gridWrap;
                        const moveHead = () => {
                            if(!isPlaying) return;
                            let curSec = window.Tone.Transport.seconds; 
                            let bSec = 60 / window.Tone.Transport.bpm.value;
                            let headLeftPx = (curSec / bSec) * pxPerBeat; 
                            playhead.style.transform = `translateX(${headLeftPx}px)`;
                            
                            // X推流前进拉锯战锁定，防止手动卷轮错乱遮眼
                            if (headLeftPx > scrollerGrid.clientWidth / 2.5) { scrollerGrid.scrollLeft = headLeftPx - scrollerGrid.clientWidth / 2.5; }
                            else { scrollerGrid.scrollLeft = 0; }
                            
                            loopAnim = requestAnimationFrame(moveHead);
                        };
                        moveHead();
                    }
                };

            }).catch(e => { btnPlay.innerText = 'RESTRICT'; console.log("流获取截停：", e); });
        };

        if (window.Tone && window.Midi) { startBinding(); return; }
        
        if (!window.hmkToneFetching) {
            window.hmkToneFetching = true;
            const s1 = document.createElement('script');
            s1.src = 'https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.min.js';
            s1.crossOrigin = "anonymous"; 
            s1.onerror = () => { btnPlay.innerText = "NO CDN"; }
            document.body.appendChild(s1);
            s1.onload = () => {
                const s2 = document.createElement('script');
                s2.src = 'https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js';
                s2.crossOrigin = "anonymous"; 
                s2.onerror = () => { btnPlay.innerText = "NO CDN"; }
                document.body.appendChild(s2);
                s2.onload = () => {
                    const ev = new CustomEvent("HmkAudioReady"); document.dispatchEvent(ev); startBinding();
                };
            };
        } else {
            document.addEventListener("HmkAudioReady", () => { startBinding(); });
        }
    }

    function initBannerAndText() {
      const header = document.getElementById('page-header');
      if (header && !document.getElementById('bg-slider-container')) {
        const sliderBox = document.createElement('div');
        sliderBox.id = 'bg-slider-container';
        imgPool.forEach(src => { const s = document.createElement('div'); s.className = 'bg-slide-item'; s.style.backgroundImage = `url("${src}")`; sliderBox.appendChild(s); });
        sliderBox.appendChild(sliderBox.children[0].cloneNode(true));
        header.prepend(sliderBox); 
        let cIdx = 0; const sEngine = 'transform 1s cubic-bezier(0.65, 0, 0.35, 1)'; sliderBox.style.transition = sEngine;
        setInterval(() => {
          cIdx++; sliderBox.style.transition = sEngine; sliderBox.style.transform = `translateX(-${cIdx * 100}%)`;
          if (cIdx === imgPool.length) { setTimeout(() => { sliderBox.style.transition = 'none'; cIdx = 0; sliderBox.style.transform = `translateX(0)`; }, 1000); }
        }, 6000);
      }
      const subText = document.getElementById('site-subtitle');
      if (subText && !subText.hasAttribute('data-inited')) {
        subText.setAttribute('data-inited', '1');
        subText.style.transition = 'opacity 0.5s ease-in-out';
        let lastIdx = Math.floor(Math.random() * textPool.length); subText.innerText = textPool[lastIdx];
        setInterval(() => {
          subText.style.opacity = 0; setTimeout(() => {
            let nIdx; do { nIdx = Math.floor(Math.random()*textPool.length); } while(nIdx===lastIdx && textPool.length>1);
            lastIdx = nIdx; subText.innerText = textPool[lastIdx]; subText.style.opacity = 1; 
          }, 500); 
        }, 4000);
      }
    }

    function remodelPosts() {
      const container = document.getElementById('recent-posts');
      if(!container || container.querySelector('.hmk-hero')) return; 
      const originalPosts = Array.from(container.querySelectorAll('.recent-post-item'));
      if(originalPosts.length === 0) return;
      let materials = [];
      originalPosts.forEach((post) => {
          let a = post.querySelector('.article-title'); let t = a ? a.textContent.trim() : "无标题"; let l = a ? a.href : "/";
          let imgEl = post.querySelector('img'); let pic = imgEl ? imgEl.src : null;
          let c = post.querySelector('.content'); let ext = c ? c.textContent.trim() : "";
          let dateEl = post.querySelector('time'); let dateTxt = dateEl ? dateEl.textContent.trim() : "未标记";
          materials.push({ title: t, link: l, picture: pic, excerpt: ext, metaDate: dateTxt });
      });
      let paginator = container.querySelector('#pagination');
      container.innerHTML = "";
      materials.forEach((m, i) => {
          let card = document.createElement('div'); card.className = "hmk-card"; let activeImg = m.picture || defaultImgs[i % defaultImgs.length];
          if(i === 0) {
              card.classList.add("hmk-hero"); let fc = m.title.charAt(0); let rc = m.title.substring(1);
              card.innerHTML = `<a href="${m.link}" class="hmk-hero-left" style="background-image:url('${activeImg}');"><div class="hmk-hero-mask"></div><h2 class="hmk-hero-title"><span class="hmk-dropcap">${fc}</span>${rc}</h2></a><a href="${m.link}" class="hmk-hero-right" style="text-decoration:none;"><div class="hmk-hero-quote">“</div><div class="hmk-hero-excerpt">${m.excerpt}</div></a>`;
          } else {
              if(i === 1) { let s = document.createElement("div"); s.className = "hmk-sep"; s.innerText = "更多内容"; container.appendChild(s); }
              card.classList.add("hmk-grid-item");
              card.innerHTML = `<a href="${m.link}" class="hmk-grid-left" style="background-image:url('${activeImg}');"></a><a href="${m.link}" class="hmk-grid-right"><div class="hmk-grid-title">${m.title}</div><div class="hmk-grid-desc">${m.excerpt}</div><div class="hmk-grid-meta"><span class="hmk-m-sub"><i class="fas fa-calendar-alt"></i>${m.metaDate}</span></div></a>`;
          }
          container.appendChild(card);
      });
      if(paginator) container.appendChild(paginator);
    }

    function relocatePostTitleMeta() {
        const postCard = document.getElementById('post'); const postInfoBox = document.getElementById('post-info');
        if (postCard && postInfoBox) {
            const titleNode = postInfoBox.querySelector('.post-title'); const metaNode = postInfoBox.querySelector('#post-meta');
            if (titleNode && !titleNode.classList.contains('hmk-relocated')) { titleNode.classList.add('hmk-relocated'); postCard.insertBefore(titleNode, postCard.firstChild); }
            if (metaNode && !metaNode.classList.contains('hmk-relocated')) { metaNode.classList.add('hmk-relocated'); postCard.appendChild(metaNode); }
        }
    }

    function initObsidianGraph() {
        const cloudBox = document.querySelector('.layout > #page .tag-cloud-list, .layout > #page .tag-cloud-tags');
        if (!cloudBox || cloudBox.hasAttribute('data-graph-inited')) return;
        const tags = Array.from(cloudBox.querySelectorAll('a'));
        if (tags.length === 0) return;
        cloudBox.setAttribute('data-graph-inited', '1'); cloudBox.style.display = 'block';
        const nodes = tags.map(tag => {
            const fStr = tag.style.fontSize || ''; let fSize = 14; 
            if(fStr.includes('px')) fSize = parseFloat(fStr); else if(fStr.includes('em')) fSize = parseFloat(fStr) * 16;
            return { text: tag.textContent.trim(), href: tag.href, r: Math.max(5, Math.min(18, fSize / 2.5)), x: Math.random() * (cloudBox.clientWidth - 50) + 25, y: Math.random() * 450 + 25, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15 };
        });
        cloudBox.innerHTML = '<canvas id="hmk-obsidian-canvas" style="width:100%; height: 500px; display:block;"></canvas>';
        const cvs = document.getElementById('hmk-obsidian-canvas'); const ctx = cvs.getContext('2d');
        let cw = cvs.width = cloudBox.clientWidth; let ch = cvs.height = 500; cloudBox.style.height = '500px';
        let hoverNode = null;
        cvs.addEventListener('mousemove', e => { const rect = cvs.getBoundingClientRect(); hoverNode = nodes.find(n => Math.hypot(n.x - (e.clientX - rect.left), n.y - (e.clientY - rect.top)) < n.r + 15); cvs.style.cursor = hoverNode ? 'pointer' : 'default'; });
        cvs.addEventListener('click', () => { if (hoverNode) window.location.href = hoverNode.href; });
        function draw() {
            ctx.clearRect(0, 0, cw, ch); const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const normalNodeColor = isDark ? '#4a4d5b' : '#cfc3dc'; const highlightTheme = isDark ? '#926CE6' : '#8A68B0'; const textColorNormal = isDark ? '#888888' : '#888888'; const textColorHighlight = isDark ? '#ffffff' : '#333333';
            nodes.forEach(n => { n.x += n.vx; n.y += n.vy; if(n.x < n.r + 5 || n.x > cw - n.r - 5) n.vx *= -1; if(n.y < n.r + 5 || n.y > ch - n.r - 5) n.vy *= -1; });
            ctx.lineWidth = 1;
            for(let i = 0; i < nodes.length; i++){
                for(let j = i + 1; j < nodes.length; j++){
                    const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
                    if(d < 160) {
                        let isLinkActive = hoverNode ? (nodes[i] === hoverNode || nodes[j] === hoverNode) : true; if (hoverNode && !isLinkActive) continue; 
                        const alpha = (1 - d/160) * (isLinkActive && hoverNode ? 0.9 : 0.4); ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = (isLinkActive && hoverNode) ? (isDark ? `rgba(146,108,230,${alpha})` : `rgba(138,104,176,${alpha})`) : (isDark ? `rgba(120,120,120,${alpha})` : `rgba(180,180,180,${alpha})`);
                        ctx.stroke();
                    }
                }
            }
            nodes.forEach(n => {
                const isLinked = hoverNode && Math.hypot(n.x - hoverNode.x, n.y - hoverNode.y) < 160; const isHovered = n === hoverNode; const shouldLightUp = isHovered || isLinked || (!hoverNode);
                ctx.beginPath(); ctx.arc(n.x, n.y, isHovered ? n.r + 4 : n.r, 0, Math.PI * 2); ctx.fillStyle = hoverNode ? (isHovered ? highlightTheme : (isLinked ? normalNodeColor : (isDark ? '#2b2c35' : '#e7e3ea'))) : normalNodeColor; ctx.fill();
                if (shouldLightUp || n.r > 8) { ctx.font = isHovered ? 'bold 15px "Microsoft Yahei", sans-serif' : '13px "Microsoft Yahei", sans-serif'; ctx.fillStyle = isHovered ? textColorHighlight : (isLinked ? highlightTheme : textColorNormal); if(hoverNode && !shouldLightUp) ctx.fillStyle = 'transparent'; ctx.fillText(n.text, n.x + n.r + 5, n.y + 4); }
            }); requestAnimationFrame(draw);
        }
        draw(); window.addEventListener('resize', () => { if(cloudBox.clientWidth) cw = cvs.width = cloudBox.clientWidth; });
    }

    function bootEngine() {
        initBannerAndText(); initCenterSearchBar(); remodelPosts(); relocatePostTitleMeta(); initObsidianGraph(); 
        
        parseWikiSyntax(); 
        initMidiPlayerUI(); 
        
        buildCodeHighlight(); setTimeout(buildCodeHighlight, 300); setTimeout(buildCodeHighlight, 800);
        Promise.race([ document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(res => setTimeout(res, 800)) ]).then(() => { requestAnimationFrame(() => { document.documentElement.classList.add('hmk-ready'); }); });
    }

    bootEngine();
    document.addEventListener('pjax:complete', bootEngine);
  })();
